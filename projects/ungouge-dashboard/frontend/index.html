<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnGouge Executive Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #13182b;
            border-radius: 8px;
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
        }

        .header .time {
            color: #888;
            font-size: 14px;
        }

        /* Critical Alerts Section */
        .alerts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .alert-box {
            background: #13182b;
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid;
        }

        .alert-box.critical {
            border-color: #ef4444;
        }

        .alert-box.warning {
            border-color: #f59e0b;
        }

        .alert-box.good {
            border-color: #10b981;
        }

        .alert-box.info {
            border-color: #3b82f6;
        }

        .alert-box .number {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .alert-box.critical .number {
            color: #ef4444;
        }

        .alert-box.warning .number {
            color: #f59e0b;
        }

        .alert-box.good .number {
            color: #10b981;
        }

        .alert-box.info .number {
            color: #3b82f6;
        }

        .alert-box .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Metric Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #13182b;
            padding: 20px;
            border-radius: 8px;
        }

        .metric-card h3 {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .metric-subtext {
            color: #666;
            font-size: 14px;
        }

        .metric-positive {
            color: #10b981;
        }

        .metric-negative {
            color: #ef4444;
        }

        /* Progress Bar */
        .progress-section {
            background: #13182b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 30px;
            background: #0a0e17;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #10b981 70%, #f59e0b 70%, #f59e0b 90%, #ef4444 90%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        /* Tables */
        .table-section {
            background: #13182b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .table-section h3 {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px;
            border-bottom: 1px solid #1a1f35;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #1a1f35;
            font-size: 13px;
        }

        tr:hover {
            background: #0a0e17;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-todo {
            background: #1e40af;
            color: #93c5fd;
        }

        .status-in-progress {
            background: #b45309;
            color: #fcd34d;
        }

        .status-done {
            background: #047857;
            color: #6ee7b7;
        }

        .priority-high {
            color: #ef4444;
        }

        .priority-medium {
            color: #f59e0b;
        }

        .priority-low {
            color: #10b981;
        }

        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: #13182b;
            padding: 20px;
            border-radius: 8px;
        }

        .chart-card h3 {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .loading-spinner {
            border: 3px solid #1a1f35;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 UnGouge Executive Dashboard</h1>
        <div class="time" id="currentTime"></div>
    </div>

    <div id="app">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading dashboard data...</p>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = 'https://ungouge-dashboard-1093157467231.us-central1.run.app';
        
        // Update time
        function updateTime() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            document.getElementById('currentTime').textContent = now.toLocaleDateString('en-US', options);
        }
        updateTime();
        setInterval(updateTime, 60000);

        // Fetch dashboard data
        async function loadDashboard() {
            try {
                const [summary, projects, tasks, expenses] = await Promise.all([
                    fetch(`${API_URL}/dashboard/summary`).then(r => r.json()),
                    fetch(`${API_URL}/projects`).then(r => r.json()),
                    fetch(`${API_URL}/tasks`).then(r => r.json()),
                    fetch(`${API_URL}/expenses`).then(r => r.json())
                ]);

                renderDashboard(summary, projects, tasks, expenses);
            } catch (error) {
                console.error('Failed to load dashboard:', error);
                document.getElementById('app').innerHTML = `
                    <div class="loading">
                        <p style="color: #ef4444;">❌ Failed to load dashboard data</p>
                        <p style="color: #666; margin-top: 10px;">Check console for details</p>
                    </div>
                `;
            }
        }

        function renderDashboard(summary, projects, tasks, expenses) {
            const app = document.getElementById('app');
            
            // Calculate metrics
            const activeProjects = (summary.projects?.active || 0);
            const totalTasks = Object.values(summary.tasks || {}).reduce((a, b) => a + b, 0);
            const overdueCount = summary.overdue_tasks || 0;
            const monthlyExpenses = summary.monthly_expenses || 0;
            const quarterlyRevenue = summary.quarterly_revenue || 0;
            
            // Revenue goal calculation
            const revenueGoal = 5000;
            const revenueProgress = Math.round((quarterlyRevenue / revenueGoal) * 100);

            app.innerHTML = `
                <!-- Critical Alerts -->
                <div class="alerts-grid">
                    <div class="alert-box ${overdueCount > 0 ? 'critical' : 'good'}">
                        <div class="number">${overdueCount}</div>
                        <div class="label">Overdue Tasks</div>
                    </div>
                    <div class="alert-box info">
                        <div class="number">${activeProjects}</div>
                        <div class="label">Active Projects</div>
                    </div>
                    <div class="alert-box ${totalTasks > 10 ? 'warning' : 'good'}">
                        <div class="number">${totalTasks}</div>
                        <div class="label">Open Tasks</div>
                    </div>
                    <div class="alert-box ${revenueProgress >= 75 ? 'good' : 'warning'}">
                        <div class="number">${revenueProgress}%</div>
                        <div class="label">Q1 Goal Progress</div>
                    </div>
                </div>

                <!-- Metrics Cards -->
                <div class="metrics-grid">
                    <div class="metric-card">
                        <h3>💰 Quarterly Revenue</h3>
                        <div class="metric-value">$${quarterlyRevenue.toLocaleString()}</div>
                        <div class="metric-subtext">Goal: $${revenueGoal.toLocaleString()}</div>
                    </div>
                    <div class="metric-card">
                        <h3>💸 Monthly Expenses</h3>
                        <div class="metric-value">$${monthlyExpenses.toFixed(2)}</div>
                        <div class="metric-subtext">This month</div>
                    </div>
                    <div class="metric-card">
                        <h3>✅ Completed Tasks</h3>
                        <div class="metric-value">${summary.tasks?.done || 0}</div>
                        <div class="metric-subtext">${summary.tasks?.in_progress || 0} in progress</div>
                    </div>
                    <div class="metric-card">
                        <h3>📊 Health Score</h3>
                        <div class="metric-value">${projects.projects?.[0]?.health_score || 'N/A'}</div>
                        <div class="metric-subtext">Overall project health</div>
                    </div>
                </div>

                <!-- Revenue Progress Bar -->
                <div class="progress-section">
                    <div class="progress-header">
                        <h3>🎯 Q1 REVENUE GOAL</h3>
                        <span style="color: #fff; font-weight: 600;">$${quarterlyRevenue.toLocaleString()} / $${revenueGoal.toLocaleString()}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${revenueProgress}%">${revenueProgress}%</div>
                    </div>
                </div>

                <!-- Projects Overview -->
                <div class="table-section">
                    <h3>📁 Active Projects</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Project Name</th>
                                <th>Status</th>
                                <th>Progress</th>
                                <th>Revenue</th>
                                <th>Health Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${projects.projects?.map(project => `
                                <tr>
                                    <td><strong>${project.name}</strong></td>
                                    <td><span class="status-badge status-${project.status}">${project.status}</span></td>
                                    <td>${project.progress}%</td>
                                    <td>$${project.revenue_current?.toLocaleString() || 0} / $${project.revenue_goal?.toLocaleString() || 0}</td>
                                    <td style="color: ${project.health_score > 80 ? '#10b981' : project.health_score > 60 ? '#f59e0b' : '#ef4444'}">${project.health_score}/100</td>
                                </tr>
                            `).join('') || '<tr><td colspan="5" style="text-align: center; color: #666;">No projects found</td></tr>'}
                        </tbody>
                    </table>
                </div>

                <!-- Active Tasks -->
                <div class="table-section">
                    <h3>📋 Active Tasks</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Task</th>
                                <th>Project</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Due Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tasks.tasks?.filter(t => t.status !== 'done' && t.status !== 'cancelled').slice(0, 10).map(task => {
                                const project = projects.projects?.find(p => p.id === task.project_id);
                                return `
                                    <tr>
                                        <td><strong>${task.title}</strong></td>
                                        <td>${project?.name || 'Unknown'}</td>
                                        <td class="priority-${task.priority}">${task.priority}</td>
                                        <td><span class="status-badge status-${task.status.replace('_', '-')}">${task.status}</span></td>
                                        <td>${task.due_date || 'No deadline'}</td>
                                    </tr>
                                `;
                            }).join('') || '<tr><td colspan="5" style="text-align: center; color: #666;">No active tasks</td></tr>'}
                        </tbody>
                    </table>
                </div>

                <!-- Recent Expenses -->
                <div class="table-section">
                    <h3>💳 Recent Expenses</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Vendor</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${expenses.expenses?.slice(0, 10).map(expense => `
                                <tr>
                                    <td>${expense.date}</td>
                                    <td>${expense.description}</td>
                                    <td>${expense.category}</td>
                                    <td>${expense.vendor || 'N/A'}</td>
                                    <td style="color: #ef4444; font-weight: 600;">$${expense.amount.toFixed(2)}</td>
                                </tr>
                            `).join('') || '<tr><td colspan="5" style="text-align: center; color: #666;">No expenses recorded</td></tr>'}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Load dashboard on page load
        loadDashboard();

        // Refresh every 5 minutes
        setInterval(loadDashboard, 300000);
    </script>
</body>
</html>
