<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnGouge Executive Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #13182b;
            border-radius: 8px;
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
        }

        .header .time {
            color: #888;
            font-size: 14px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            font-size: 14px;
            color: #94a3b8;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #334155;
            color: #e2e8f0;
        }

        .back-button {
            display: inline-block;
            padding: 10px 20px;
            background: #1a1f35;
            color: #3b82f6;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #3b82f6;
            transition: background 0.2s;
        }

        .back-button:hover {
            background: #252b45;
        }

        /* Critical Alerts Section */
        .alerts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .alert-box {
            background: #13182b;
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid;
        }

        .alert-box.critical {
            border-color: #ef4444;
        }

        .alert-box.warning {
            border-color: #f59e0b;
        }

        .alert-box.good {
            border-color: #10b981;
        }

        .alert-box.info {
            border-color: #3b82f6;
        }

        .alert-box .number {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .alert-box.critical .number {
            color: #ef4444;
        }

        .alert-box.warning .number {
            color: #f59e0b;
        }

        .alert-box.good .number {
            color: #10b981;
        }

        .alert-box.info .number {
            color: #3b82f6;
        }

        .alert-box .label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Module Cards Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .module-card {
            background: #13182b;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #3b82f6;
        }

        .module-card h2 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .module-stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1a1f35;
        }

        .module-stat:last-of-type {
            border-bottom: none;
        }

        .module-stat .label {
            color: #888;
            font-size: 14px;
        }

        .module-stat .value {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .module-alert {
            margin-top: 15px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            color: #ef4444;
            font-size: 13px;
            border-radius: 4px;
        }

        .module-alert.warning {
            background: rgba(245, 158, 11, 0.1);
            border-left-color: #f59e0b;
            color: #f59e0b;
        }

        .view-details {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #1a1f35;
            color: #3b82f6;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #3b82f6;
            transition: background 0.2s;
        }

        .view-details:hover {
            background: #252b45;
        }

        /* Activity Feed */
        .activity-section {
            background: #13182b;
            padding: 20px;
            border-radius: 8px;
        }

        .activity-section h3 {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .activity-item {
            display: flex;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #1a1f35;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-time {
            color: #666;
            font-size: 12px;
            min-width: 80px;
        }

        .activity-module {
            color: #3b82f6;
            font-size: 12px;
            font-weight: 600;
            min-width: 100px;
        }

        .activity-text {
            color: #e0e0e0;
            font-size: 13px;
        }

        /* Detail View */
        .detail-section {
            background: #13182b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .detail-section h3 {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px;
            border-bottom: 1px solid #1a1f35;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #1a1f35;
            font-size: 13px;
        }

        tr:hover {
            background: #0a0e17;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: #047857;
            color: #6ee7b7;
        }

        .status-in-progress {
            background: #b45309;
            color: #fcd34d;
        }

        .priority-high {
            color: #ef4444;
        }

        .priority-medium {
            color: #f59e0b;
        }

        .priority-low {
            color: #10b981;
        }

        .progress-bar-container {
            background: #0a0e17;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981 0%, #10b981 70%, #f59e0b 70%, #f59e0b 90%, #ef4444 90%);
            transition: width 0.5s ease;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .loading-spinner {
            border: 3px solid #1a1f35;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="pageTitle">🎯 UnGouge Executive Dashboard</h1>
        <div class="header-right">
            <div class="user-info" id="userInfo">Loading...</div>
            <button class="logout-btn" onclick="logout()">Logout</button>
            <div class="time" id="currentTime"></div>
        </div>
    </div>

    <div id="app">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading dashboard data...</p>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = window.location.origin;
        
        // Global data storage
        let dashboardData = {
            summary: null,
            projects: null,
            tasks: null,
            expenses: null
        };

        // Current view state
        let currentView = 'overview';
        let currentModule = null;

        // Update time
        function updateTime() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            document.getElementById('currentTime').textContent = now.toLocaleDateString('en-US', options);
        }
        updateTime();
        setInterval(updateTime, 60000);

        // Fetch dashboard data
        async function loadDashboard() {
            try {
                const [summary, projects, tasks, expenses] = await Promise.all([
                    fetch(`${API_URL}/dashboard/summary`).then(r => r.json()),
                    fetch(`${API_URL}/projects`).then(r => r.json()),
                    fetch(`${API_URL}/tasks`).then(r => r.json()),
                    fetch(`${API_URL}/expenses`).then(r => r.json())
                ]);

                dashboardData = { summary, projects, tasks, expenses };
                showOverview();
            } catch (error) {
                console.error('Failed to load dashboard:', error);
                document.getElementById('app').innerHTML = `
                    <div class="loading">
                        <p style="color: #ef4444;">❌ Failed to load dashboard data</p>
                        <p style="color: #666; margin-top: 10px;">Check console for details</p>
                    </div>
                `;
            }
        }

        // Show overview page
        function showOverview() {
            currentView = 'overview';
            document.getElementById('pageTitle').textContent = '🎯 UnGouge Executive Dashboard';
            
            const { summary, projects, tasks, expenses } = dashboardData;
            
            const activeProjects = summary.projects?.active || 0;
            const totalTasks = Object.values(summary.tasks || {}).reduce((a, b) => a + b, 0);
            const overdueCount = summary.overdue_tasks || 0;
            const monthlyExpenses = summary.monthly_expenses || 0;
            const quarterlyRevenue = summary.quarterly_revenue || 0;
            const revenueGoal = 5000;
            const revenueProgress = Math.round((quarterlyRevenue / revenueGoal) * 100);

            // Get project by name
            const ungougeProject = projects.projects?.find(p => p.name.includes('Quote')) || {};
            const youtubeProject = projects.projects?.find(p => p.name.includes('YouTube')) || {};

            document.getElementById('app').innerHTML = `
                <!-- Critical Alerts -->
                <div class="alerts-grid">
                    <div class="alert-box ${overdueCount > 0 ? 'critical' : 'good'}">
                        <div class="number">${overdueCount}</div>
                        <div class="label">Overdue Tasks</div>
                    </div>
                    <div class="alert-box info">
                        <div class="number">${activeProjects}</div>
                        <div class="label">Active Projects</div>
                    </div>
                    <div class="alert-box ${totalTasks > 10 ? 'warning' : 'good'}">
                        <div class="number">${totalTasks}</div>
                        <div class="label">Open Tasks</div>
                    </div>
                    <div class="alert-box ${revenueProgress >= 75 ? 'good' : 'warning'}">
                        <div class="number">${revenueProgress}%</div>
                        <div class="label">Q1 Goal Progress</div>
                    </div>
                </div>

                <!-- Module Cards -->
                <div class="modules-grid">
                    <!-- UnGouge.ai Module -->
                    <div class="module-card">
                        <h2>🎯 UNGOUGE.AI</h2>
                        <div class="module-stat">
                            <span class="label">Revenue</span>
                            <span class="value">$${quarterlyRevenue.toLocaleString()} (${revenueProgress}%)</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Expenses</span>
                            <span class="value">$${monthlyExpenses.toFixed(2)}</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Health Score</span>
                            <span class="value" style="color: ${ungougeProject.health_score > 80 ? '#10b981' : '#f59e0b'}">${ungougeProject.health_score || 'N/A'}/100</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Progress</span>
                            <span class="value">${ungougeProject.progress || 0}%</span>
                        </div>
                        <div class="module-alert">
                            🔴 ${summary.tasks?.in_progress || 0} tasks in progress
                        </div>
                        <a class="view-details" onclick="showDetail('ungouge')">View Details →</a>
                    </div>

                    <!-- YouTube Module -->
                    <div class="module-card">
                        <h2>📹 YOUTUBE CHANNEL</h2>
                        <div class="module-stat">
                            <span class="label">Subscribers</span>
                            <span class="value">0 <span style="color: #6b7280;">(channel not created)</span></span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Videos Published</span>
                            <span class="value">3</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Views (7d)</span>
                            <span class="value">0</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Watch Time</span>
                            <span class="value">0 hours</span>
                        </div>
                        <div class="module-alert warning">
                            🟡 Episode 4 render 87% complete
                        </div>
                        <a class="view-details" onclick="showDetail('youtube')">View Details →</a>
                    </div>

                    <!-- Finances Module -->
                    <div class="module-card">
                        <h2>💰 FINANCES</h2>
                        <div class="module-stat">
                            <span class="label">Revenue (QTD)</span>
                            <span class="value">$${quarterlyRevenue.toLocaleString()}</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Expenses (MTD)</span>
                            <span class="value">$${monthlyExpenses.toFixed(2)}</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Net Income</span>
                            <span class="value" style="color: #10b981;">+$${(quarterlyRevenue - monthlyExpenses).toFixed(2)}</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Burn Rate</span>
                            <span class="value">-$${(monthlyExpenses / 30).toFixed(2)}/day</span>
                        </div>
                        <div class="module-alert warning">
                            💳 Last: ${expenses.expenses?.[0]?.description || 'No expenses'} $${expenses.expenses?.[0]?.amount.toFixed(2) || '0'}
                        </div>
                        <a class="view-details" onclick="showDetail('finances')">View Details →</a>
                    </div>

                    
                </div>

                <!-- Recent Activity -->
                <div class="activity-section">
                    <h3>📋 RECENT ACTIVITY (All Projects)</h3>
                    <div class="activity-item">
                        <div class="activity-time">10 min ago</div>
                        <div class="activity-module">UnGouge</div>
                        <div class="activity-text">Cost model updated</div>
                    </div>
                    <div class="activity-item">
                        <div class="activity-time">2 hrs ago</div>
                        <div class="activity-module">YouTube</div>
                        <div class="activity-text">Video render started</div>
                    </div>
                    <div class="activity-item">
                        <div class="activity-time">Yesterday</div>
                        <div class="activity-module">Finances</div>
                        <div class="activity-text">Expense logged: ${expenses.expenses?.[0]?.description || 'N/A'} $${expenses.expenses?.[0]?.amount.toFixed(2) || '0'}</div>
                    </div>
                    <div class="activity-item">
                        <div class="activity-time">Yesterday</div>
                        <div class="activity-module">UnGouge</div>
                        <div class="activity-text">Task completed: Email template</div>
                    </div>
                </div>
            `;
        }

        // Show detail view for a module
        function showDetail(module) {
            currentView = 'detail';
            currentModule = module;
            
            const { summary, projects, tasks, expenses } = dashboardData;

            if (module === 'ungouge') {
                document.getElementById('pageTitle').textContent = '🎯 UnGouge.ai - Detailed View';
                const ungougeProject = projects.projects?.find(p => p.name.includes('Quote'));
                const projectTasks = tasks.tasks?.filter(t => t.project_id === ungougeProject?.id);

                document.getElementById('app').innerHTML = `
                    <a class="back-button" onclick="showOverview()">← Back to Overview</a>
                    
                    <div class="detail-section" style="margin-top: 20px;">
                        <h3>💰 FINANCIAL</h3>
                        <div class="module-stat">
                            <span class="label">Revenue</span>
                            <span class="value">$${ungougeProject?.revenue_current?.toLocaleString() || 0} (${ungougeProject?.progress || 0}% of $${ungougeProject?.revenue_goal?.toLocaleString() || 0} goal)</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Expenses</span>
                            <span class="value">$${summary.monthly_expenses.toFixed(2)}</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Profit</span>
                            <span class="value" style="color: #10b981;">$${((ungougeProject?.revenue_current || 0) - summary.monthly_expenses).toFixed(2)}</span>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>📊 PROJECT STATUS</h3>
                        <div style="margin-bottom: 10px;">
                            <strong style="color: #fff;">${ungougeProject?.name || 'Unknown'}</strong>
                            <span style="color: #888; margin-left: 20px;">${ungougeProject?.progress || 0}% complete</span>
                            <span style="color: ${ungougeProject?.health_score > 80 ? '#10b981' : '#f59e0b'}; margin-left: 20px;">${ungougeProject?.health_score || 0}/100</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" style="width: ${ungougeProject?.progress || 0}%"></div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>📋 ACTIVE TASKS (${projectTasks?.length || 0} total)</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Task</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Due Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${projectTasks?.map(task => `
                                    <tr>
                                        <td><strong>${task.title}</strong></td>
                                        <td class="priority-${task.priority}">${task.priority}</td>
                                        <td><span class="status-badge status-${task.status}">${task.status}</span></td>
                                        <td>${task.due_date || 'No deadline'}</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="4" style="text-align: center; color: #666;">No tasks found</td></tr>'}
                            </tbody>
                        </table>
                    </div>

                    <div class="detail-section">
                        <h3>💳 EXPENSES</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${expenses.expenses?.slice(0, 10).map(expense => `
                                    <tr>
                                        <td>${expense.date}</td>
                                        <td>${expense.description}</td>
                                        <td>${expense.category}</td>
                                        <td style="color: #ef4444; font-weight: 600;">$${expense.amount.toFixed(2)}</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="4" style="text-align: center; color: #666;">No expenses</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (module === 'youtube') {
                document.getElementById('pageTitle').textContent = '📹 YouTube Channel - Detailed View';
                document.getElementById('app').innerHTML = `
                    <a class="back-button" onclick="showOverview()">← Back to Overview</a>
                    
                    <div class="detail-section" style="margin-top: 20px;">
                        <h3>📊 CHANNEL STATS</h3>
                        <div class="module-stat">
                            <span class="label">Subscribers</span>
                            <span class="value">0 <span style="color: #6b7280;">(not created)</span></span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Videos Published</span>
                            <span class="value">3</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Views (7 days)</span>
                            <span class="value">0</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Watch Time</span>
                            <span class="value">0 hours</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Avg View Duration</span>
                            <span class="value">2:51</span>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>🎬 RECENT VIDEOS</h3>
                        <p style="color: #666; font-size: 14px;">Integration with YouTube API coming soon...</p>
                    </div>

                    <div class="detail-section">
                        <h3>📋 CONTENT TASKS</h3>
                        <p style="color: #666; font-size: 14px;">Episode 4: Rendering (87% complete)</p>
                        <p style="color: #666; font-size: 14px; margin-top: 10px;">Episode 5: Script draft</p>
                    </div>
                `;
            } else if (module === 'finances') {
                document.getElementById('pageTitle').textContent = '💰 Finances - Detailed View';
                document.getElementById('app').innerHTML = `
                    <a class="back-button" onclick="showOverview()">← Back to Overview</a>
                    
                    <div class="detail-section" style="margin-top: 20px;">
                        <h3>💰 SUMMARY</h3>
                        <div class="module-stat">
                            <span class="label">Quarterly Revenue</span>
                            <span class="value">$${summary.quarterly_revenue.toLocaleString()}</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Monthly Expenses</span>
                            <span class="value">$${summary.monthly_expenses.toFixed(2)}</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Net Income</span>
                            <span class="value" style="color: #10b981;">+$${(summary.quarterly_revenue - summary.monthly_expenses).toFixed(2)}</span>
                        </div>
                        <div class="module-stat">
                            <span class="label">Daily Burn Rate</span>
                            <span class="value">-$${(summary.monthly_expenses / 30).toFixed(2)}/day</span>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3>💳 RECENT EXPENSES</h3>
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Vendor</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${expenses.expenses?.slice(0, 15).map(expense => `
                                    <tr>
                                        <td>${expense.date}</td>
                                        <td>${expense.description}</td>
                                        <td>${expense.category}</td>
                                        <td>${expense.vendor || 'N/A'}</td>
                                        <td style="color: #ef4444; font-weight: 600;">$${expense.amount.toFixed(2)}</td>
                                    </tr>
                                `).join('') || '<tr><td colspan="5" style="text-align: center; color: #666;">No expenses</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                `;
        
        }
        }

        // Authentication functions
        async function checkAuth() {
            try {
                const response = await fetch(`${API_URL}/auth/status`, {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    // Not authenticated, redirect to login
                    window.location.href = '/';
                    return false;
                }
                
                const data = await response.json();
                document.getElementById('userInfo').textContent = data.user.email;
                return true;
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/';
                return false;
            }
        }

        async function logout() {
            try {
                const response = await fetch(`${API_URL}/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    console.error('Logout failed');
                    // Force redirect anyway
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/';
            }
        }

        // Check authentication on page load
        checkAuth().then(authenticated => {
            if (authenticated) {
                // Load dashboard on page load
                loadDashboard();

                // Refresh every 5 minutes
                setInterval(loadDashboard, 300000);
            }
        });
    </script>
</body>
</html>
