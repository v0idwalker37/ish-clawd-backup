<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tasks - UnGouge Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 22px;
            }

            .filters {
                flex-direction: column;
            }

            .filter-group {
                width: 100%;
            }

            .filter-group select,
            .filter-group input {
                width: 100%;
            }

            .task-card {
                padding: 14px;
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #fff;
        }

        .back-btn {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #475569;
        }

        .filters {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .filter-group select,
        .filter-group input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .tasks-grid {
            display: grid;
            gap: 15px;
        }

        .task-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-card:hover {
            background: #2d3748;
            transform: translateX(5px);
        }

        .task-card.urgent { border-left-color: #ef4444; }
        .task-card.high { border-left-color: #f97316; }
        .task-card.medium { border-left-color: #eab308; }
        .task-card.low { border-left-color: #6b7280; }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }

        .task-project {
            font-size: 12px;
            color: #94a3b8;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 10px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.todo { background: #334155; color: #94a3b8; }
        .status-badge.in_progress { background: #1e40af; color: #93c5fd; }
        .status-badge.done { background: #166534; color: #86efac; }
        .status-badge.blocked { background: #991b1b; color: #fca5a5; }

        .priority-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .priority-badge.urgent { background: #7f1d1d; color: #fca5a5; }
        .priority-badge.high { background: #7c2d12; color: #fdba74; }
        .priority-badge.medium { background: #713f12; color: #fde047; }
        .priority-badge.low { background: #374151; color: #9ca3af; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-complete {
            background: #166534;
            color: #86efac;
        }

        .btn-complete:hover {
            background: #14532d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 All Tasks</h1>
        <div style="display: flex; gap: 12px;">
            <button class="back-btn" style="background: #3b82f6;" onclick="showCreateModal()">+ Create Task</button>
            <a href="/dashboard-v2.html" class="back-btn">← Back to Dashboard</a>
        </div>
    </div>

    <!-- Create Task Modal -->
    <div id="createModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #1e293b; padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <h2 style="color: #fff; margin-bottom: 20px;">Create New Task</h2>
            <form id="createTaskForm">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px;">Title *</label>
                    <input type="text" id="newTaskTitle" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px;">Category *</label>
                    <select id="newTaskCategory" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px;">
                        <option value="">Select category...</option>
                        <option value="ungouge">Ungouge.ai</option>
                        <option value="yt">YouTube / Content</option>
                    </select>
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px;">Project *</label>
                    <select id="newTaskProject" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px;">
                        <option value="">Select project...</option>
                    </select>
                </div>
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px;">Description</label>
                    <textarea id="newTaskDescription" rows="3" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px; resize: vertical;"></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
                    <div>
                        <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px;">Priority</label>
                        <select id="newTaskPriority" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px;">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px;">Due Date</label>
                        <input type="date" id="newTaskDueDate" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px;">
                    </div>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px;">Estimated Hours</label>
                    <input type="number" id="newTaskHours" step="0.5" min="0" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 14px;">
                </div>
                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" onclick="hideCreateModal()" style="padding: 10px 20px; background: #334155; border: none; border-radius: 6px; color: #e2e8f0; cursor: pointer;">Cancel</button>
                    <button type="submit" style="padding: 10px 20px; background: #3b82f6; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: 600;">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <div class="filters">
        <div class="filter-group">
            <label>Search</label>
            <input type="text" id="searchInput" placeholder="Search tasks...">
        </div>
        <div class="filter-group">
            <label>Status</label>
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="blocked">Blocked</option>
                <option value="done">Complete</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Priority</label>
            <select id="priorityFilter">
                <option value="">All Priorities</option>
                <option value="urgent">Urgent</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Category</label>
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="ungouge">Ungouge.ai</option>
                <option value="youtube">YouTube</option>
                <option value="social">Social</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Project</label>
            <select id="projectFilter">
                <option value="">All Projects</option>
            </select>
        </div>
        <div class="filter-group" style="justify-content: center;">
            <label>&nbsp;</label>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px;">
                <input type="checkbox" id="hideCompleted" style="width: 16px; height: 16px; cursor: pointer;">
                <span style="font-size: 14px; text-transform: none;">Hide Completed</span>
            </label>
        </div>
        <div class="filter-group" style="justify-content: center;">
            <label>&nbsp;</label>
            <button id="myFocusBtn" onclick="toggleMyFocus()" style="padding: 8px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 14px; font-family: inherit; transition: all 0.2s;">🎯 My Focus</button>
        </div>
    </div>

    <div id="tasksContainer">
        <div class="loading">Loading tasks...</div>
    </div>

    <script>
        // XSS Protection: escape user-supplied text before rendering in HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let allTasks = [];
        let allProjects = [];
        let projects = {};
        let projectCategories = {};
        let myFocusActive = false;

        function toggleMyFocus() {
            myFocusActive = !myFocusActive;
            const btn = document.getElementById('myFocusBtn');
            if (myFocusActive) {
                btn.style.background = '#1e40af';
                btn.style.borderColor = '#3b82f6';
                btn.style.color = '#fff';
            } else {
                btn.style.background = '#0f172a';
                btn.style.borderColor = '#334155';
                btn.style.color = '#94a3b8';
            }
            renderTasks();
        }

        // Fetch tasks and projects
        async function loadData() {
            try {
                const [tasksRes, projectsRes] = await Promise.all([
                    fetch('/tasks', { credentials: 'include' }),
                    fetch('/projects', { credentials: 'include' })
                ]);
                
                // Check for auth errors
                if (tasksRes.status === 401) {
                    console.error('Auth failed for /tasks');
                    window.location.href = '/login.html';
                    return;
                }
                
                const tasksData = await tasksRes.json();
                const projectsData = await projectsRes.json();
                
                console.log('Tasks loaded:', tasksData);
                console.log('Projects loaded:', projectsData);
                
                allTasks = tasksData.tasks || [];
                allProjects = projectsData.projects || [];
                projects = Object.fromEntries(
                    (projectsData.projects || []).map(p => [p.id, p.name])
                );
                projectCategories = Object.fromEntries(
                    (projectsData.projects || []).map(p => [String(p.id), p.category || 'general'])
                );

                // Populate project filter (alphabetically sorted)
                const projectFilter = document.getElementById('projectFilter');
                Object.entries(projects)
                    .sort((a, b) => a[1].localeCompare(b[1]))
                    .forEach(([id, name]) => {
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = name;
                        projectFilter.appendChild(option);
                    });

                // Pre-select category from URL param if present
                const urlParams = new URLSearchParams(window.location.search);
                const categoryParam = urlParams.get('category');
                if (categoryParam) {
                    const categoryFilterEl = document.getElementById('categoryFilter');
                    categoryFilterEl.value = categoryParam;
                    // Also filter project dropdown to match category
                    projectFilter.innerHTML = '<option value="">All Projects</option>';
                    Object.entries(projects)
                        .filter(([id]) => !categoryParam || projectCategories[id] === categoryParam)
                        .sort((a, b) => a[1].localeCompare(b[1]))
                        .forEach(([id, name]) => {
                            const option = document.createElement('option');
                            option.value = id;
                            option.textContent = name;
                            projectFilter.appendChild(option);
                        });
                }

                // Pre-select project from URL param if present
                const projectParam = urlParams.get('project');
                if (projectParam) {
                    // Find matching option (handle string/number mismatch)
                    const options = Array.from(projectFilter.options);
                    const match = options.find(opt => String(opt.value) === String(projectParam));
                    if (match) {
                        projectFilter.value = match.value;
                        console.log('Pre-selected project filter:', projectParam, '→', match.textContent);
                    } else {
                        console.warn('Project param not found in options:', projectParam, 'Available:', options.map(o => o.value));
                    }
                }

                renderTasks();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('tasksContainer').innerHTML = 
                    '<div class="empty-state"><h2>Error loading tasks</h2><p>Please refresh the page. Error: ' + error.message + '</p></div>';
            }
        }

        function renderTasks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;
            const categoryFilter = document.getElementById('categoryFilter').value;
            const projectFilter = document.getElementById('projectFilter').value;
            const hideCompleted = document.getElementById('hideCompleted').checked;

            let filtered = allTasks.filter(task => {
                // Hide completed checkbox
                if (hideCompleted && task.status === 'done') return false;
                // My Focus filter: status != done AND (priority urgent/high OR due within 7 days)
                if (myFocusActive) {
                    if (task.status === 'done') return false;
                    const isHighPriority = task.priority === 'urgent' || task.priority === 'high';
                    let isDueSoon = false;
                    if (task.due_date) {
                        const due = new Date(task.due_date);
                        const now = new Date();
                        const daysUntil = Math.ceil((due - now) / (1000 * 60 * 60 * 24));
                        isDueSoon = daysUntil <= 7;
                    }
                    if (!isHighPriority && !isDueSoon) return false;
                }
                // Search filter
                if (searchTerm && !task.title.toLowerCase().includes(searchTerm)) return false;
                // Status filter (normalize both values for comparison)
                if (statusFilter && task.status !== statusFilter) return false;
                // Priority filter
                if (priorityFilter && task.priority !== priorityFilter) return false;
                // Category filter
                if (categoryFilter && projectCategories[String(task.project_id)] !== categoryFilter) return false;
                // Project filter (use == for type coercion since one might be string)
                if (projectFilter && String(task.project_id) !== String(projectFilter)) return false;
                return true;
            });

            const container = document.getElementById('tasksContainer');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>No tasks found</h2><p>Try adjusting your filters</p></div>';
                return;
            }

            // Show count header
            const countText = `Showing ${filtered.length} of ${allTasks.length} tasks`;
            container.innerHTML = `<div style="margin-bottom: 16px; color: #94a3b8; font-size: 14px;">${countText}</div>` + '<div class="tasks-grid">' + filtered.map(task => `
                <div class="task-card ${escapeHtml(task.priority)}" data-task-id="${task.id}" onclick="openTaskEdit(${task.id})" style="cursor:pointer">
                    <div class="task-header">
                        <div>
                            <div class="task-title">${escapeHtml(task.title)}</div>
                            <div class="task-project">${escapeHtml(projects[task.project_id] || 'Unknown Project')}</div>
                        </div>
                        <div>
                            <span class="status-badge ${escapeHtml(task.status)}">${escapeHtml(task.status.replace('_', ' '))}</span>
                        </div>
                    </div>
                    ${task.description ? `<p style="color: #94a3b8; font-size: 14px; margin-top: 10px;">${escapeHtml(task.description)}</p>` : ''}
                    <div class="task-meta">
                        <span class="priority-badge ${task.priority}">Priority: ${task.priority}</span>
                        ${task.due_date ? `<span>📅 Due: ${new Date(task.due_date).toLocaleDateString()}</span>` : ''}
                        ${task.estimated_hours ? `<span>⏱️ Est: ${task.estimated_hours}h</span>` : ''}
                    </div>
                    ${task.status !== 'done' ? `
                        <div class="task-actions">
                            <button class="btn btn-complete" onclick="markComplete(${task.id}, event)">✓ Mark Complete</button>
                        </div>
                    ` : ''}
                </div>
            `).join('') + '</div>';
        }

        async function markComplete(taskId, event) {
            event.stopPropagation();
            
            if (!confirm('Mark this task as complete?')) return;

            try {
                const response = await fetch(`/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ status: 'done', completed_at: new Date().toISOString() })
                });

                if (response.ok) {
                    const task = allTasks.find(t => t.id === taskId);
                    if (task) task.status = 'done';
                    renderTasks();
                } else {
                    alert('Failed to update task');
                }
            } catch (error) {
                console.error('Error updating task:', error);
                alert('Error updating task');
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', renderTasks);
        document.getElementById('statusFilter').addEventListener('change', renderTasks);
        document.getElementById('priorityFilter').addEventListener('change', renderTasks);
        document.getElementById('categoryFilter').addEventListener('change', function() {
            // When category changes, filter the project dropdown to match
            const category = this.value;
            const projectFilter = document.getElementById('projectFilter');
            const currentProject = projectFilter.value;
            projectFilter.innerHTML = '<option value="">All Projects</option>';
            Object.entries(projects)
                .filter(([id]) => !category || projectCategories[id] === category)
                .sort((a, b) => a[1].localeCompare(b[1]))
                .forEach(([id, name]) => {
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = name;
                    projectFilter.appendChild(option);
                });
            // Restore selection if still valid
            if (currentProject && Array.from(projectFilter.options).some(o => o.value === currentProject)) {
                projectFilter.value = currentProject;
            }
            renderTasks();
        });
        document.getElementById('projectFilter').addEventListener('change', renderTasks);
        document.getElementById('hideCompleted').addEventListener('change', renderTasks);

        // Project category mappings
        const categoryProjects = {
            'ungouge': ['Ungouge.ai Platform', 'Executive Dashboard', 'Business Operations'],
            'yt': ['YouTube Channel', 'Content Library', 'Podcast Distribution']
        };

        // Filter projects by category
        function updateProjectsForCategory() {
            const category = document.getElementById('newTaskCategory').value;
            const projectSelect = document.getElementById('newTaskProject');
            projectSelect.innerHTML = '<option value="">Select project...</option>';
            
            if (!category) return;
            
            const allowedNames = categoryProjects[category] || [];
            Object.entries(projects).forEach(([id, name]) => {
                if (allowedNames.includes(name)) {
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = name;
                    projectSelect.appendChild(option);
                }
            });
            
            // Auto-select if only one project
            if (projectSelect.options.length === 2) {
                projectSelect.selectedIndex = 1;
            }
        }

        // Modal functions
        function showCreateModal() {
            // Reset category and project dropdowns
            document.getElementById('newTaskCategory').value = '';
            const projectSelect = document.getElementById('newTaskProject');
            projectSelect.innerHTML = '<option value="">Select project...</option>';
            
            document.getElementById('createModal').style.display = 'flex';
        }

        function hideCreateModal() {
            document.getElementById('createModal').style.display = 'none';
            document.getElementById('createTaskForm').reset();
        }

        // Handle form submission
        document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const taskData = {
                title: document.getElementById('newTaskTitle').value,
                project_id: parseInt(document.getElementById('newTaskProject').value),
                description: document.getElementById('newTaskDescription').value,
                priority: document.getElementById('newTaskPriority').value,
                due_date: document.getElementById('newTaskDueDate').value || null,
                estimated_hours: document.getElementById('newTaskHours').value ? parseFloat(document.getElementById('newTaskHours').value) : null
            };

            try {
                const response = await fetch('/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(taskData)
                });

                if (response.ok) {
                    hideCreateModal();
                    loadData(); // Reload tasks
                } else {
                    const error = await response.json();
                    alert('Failed to create task: ' + (error.detail || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error creating task:', error);
                alert('Error creating task');
            }
        });

        // Close modal when clicking outside
        document.getElementById('createModal').addEventListener('click', (e) => {
            if (e.target.id === 'createModal') {
                hideCreateModal();
            }
        });

        // Update projects when category changes
        document.getElementById('newTaskCategory').addEventListener('change', updateProjectsForCategory);

        // --- Task Edit Modal ---
        let currentEditTaskId = null;

        function openTaskEdit(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            currentEditTaskId = taskId;

            const projectName = projects[task.project_id] || 'Unknown';
            const isMilestone = task.task_type === 'milestone';

            document.getElementById('editModalType').innerHTML = (isMilestone ? '🎯 Milestone' : '📋 Task');
            document.getElementById('editTitle').value = task.title || '';
            document.getElementById('editDescription').value = task.description || '';

            // Populate project dropdown
            const editProjectSelect = document.getElementById('editProject');
            editProjectSelect.innerHTML = '<option value="">No Project</option>';
            allProjects
                .sort((a, b) => a.name.localeCompare(b.name))
                .forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.name;
                    editProjectSelect.appendChild(opt);
                });
            editProjectSelect.value = task.project_id || '';

            document.getElementById('editStatus').value = task.status || 'todo';
            document.getElementById('editPriority').value = task.priority || 'medium';
            document.getElementById('editDue').value = task.due_date ? task.due_date.split('T')[0] : '';
            document.getElementById('editHours').value = task.estimated_hours || '';
            document.getElementById('editCreated').textContent = task.created_at ? 'Created ' + new Date(task.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '';
            document.getElementById('editSaveMsg').textContent = '';

            const modal = document.getElementById('editModal');
            const overlay = document.getElementById('editOverlay');
            modal.style.display = 'block';
            overlay.style.display = 'block';
            setTimeout(() => {
                modal.style.opacity = '1';
                modal.style.transform = 'translate(-50%,-50%) scale(1)';
                overlay.style.opacity = '1';
            }, 10);
        }

        function closeEditModal() {
            const modal = document.getElementById('editModal');
            const overlay = document.getElementById('editOverlay');
            modal.style.opacity = '0';
            modal.style.transform = 'translate(-50%,-50%) scale(0.95)';
            overlay.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; overlay.style.display = 'none'; }, 200);
            currentEditTaskId = null;
        }

        async function saveTaskEdit() {
            if (!currentEditTaskId) return;
            const editProjectVal = document.getElementById('editProject').value;
            const payload = {
                title: document.getElementById('editTitle').value,
                description: document.getElementById('editDescription').value,
                project_id: editProjectVal ? parseInt(editProjectVal) : null,
                status: document.getElementById('editStatus').value,
                priority: document.getElementById('editPriority').value,
                due_date: document.getElementById('editDue').value || null,
                estimated_hours: parseFloat(document.getElementById('editHours').value) || null
            };
            try {
                const res = await fetch(`/tasks/${currentEditTaskId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    const task = allTasks.find(t => t.id === currentEditTaskId);
                    if (task) Object.assign(task, payload);
                    document.getElementById('editSaveMsg').textContent = '✓ Saved';
                    document.getElementById('editSaveMsg').style.color = '#22c55e';
                    renderTasks();
                    setTimeout(() => { document.getElementById('editSaveMsg').textContent = ''; }, 1500);
                } else {
                    document.getElementById('editSaveMsg').textContent = '✗ Error saving';
                    document.getElementById('editSaveMsg').style.color = '#ef4444';
                }
            } catch (e) {
                document.getElementById('editSaveMsg').textContent = '✗ Network error';
                document.getElementById('editSaveMsg').style.color = '#ef4444';
            }
        }

        async function deleteTaskEdit() {
            if (!currentEditTaskId) return;
            if (!confirm('Delete this task?')) return;
            try {
                const res = await fetch(`/tasks/${currentEditTaskId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (res.ok) {
                    allTasks = allTasks.filter(t => t.id !== currentEditTaskId);
                    closeEditModal();
                    renderTasks();
                } else {
                    alert('Failed to delete task');
                }
            } catch (e) {
                console.error('Failed to delete task:', e);
                alert('Network error deleting task');
            }
        }

        // Load data on page load
        loadData();
    </script>

    <!-- Task Edit Modal -->
    <div id="editOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;opacity:0;transition:opacity 0.2s" onclick="closeEditModal()"></div>
    <div id="editModal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.95);width:92%;max-width:540px;max-height:90vh;overflow-y:auto;background:#1e293b;border:1px solid #334155;border-radius:16px;z-index:1000;padding:0;opacity:0;transition:all 0.2s;box-shadow:0 20px 60px rgba(0,0,0,0.4)">
        <style>
            .em-header { padding:16px 20px 12px; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; }
            .em-close { background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer; padding:0; line-height:1; }
            .em-close:hover { color:#f1f5f9; }
            .em-body { padding:16px 20px; }
            .em-group { margin-bottom:14px; }
            .em-label { display:block; color:#94a3b8; font-size:12px; font-weight:600; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px; }
            .em-input, .em-select, .em-textarea { width:100%; background:#0f172a; border:1px solid #334155; border-radius:8px; color:#e2e8f0; padding:9px 12px; font-size:14px; font-family:inherit; outline:none; box-sizing:border-box; }
            .em-input:focus, .em-select:focus, .em-textarea:focus { border-color:#3b82f6; }
            .em-textarea { resize:vertical; min-height:70px; }
            .em-row { display:flex; gap:12px; }
            .em-row .em-group { flex:1; }
            .em-footer { padding:12px 20px 16px; display:flex; gap:10px; align-items:center; border-top:1px solid #334155; }
            .em-footer button { padding:10px 20px; border:none; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; color:white; transition:opacity 0.2s; }
            .em-footer button:hover { opacity:0.85; }
        </style>
        <div class="em-header">
            <span id="editModalType" style="font-size:12px;color:#94a3b8"></span>
            <button class="em-close" onclick="closeEditModal()">×</button>
        </div>
        <div class="em-body">
            <div class="em-group">
                <label class="em-label">Title</label>
                <input type="text" id="editTitle" class="em-input">
            </div>
            <div class="em-group">
                <label class="em-label">Description / Notes</label>
                <textarea id="editDescription" class="em-textarea"></textarea>
            </div>
            <div class="em-group">
                <label class="em-label">Project</label>
                <select id="editProject" class="em-select">
                    <option value="">No Project</option>
                </select>
            </div>
            <div class="em-row">
                <div class="em-group">
                    <label class="em-label">Status</label>
                    <select id="editStatus" class="em-select">
                        <option value="todo">To Do</option>
                        <option value="in_progress">In Progress</option>
                        <option value="blocked">Blocked</option>
                        <option value="review">Review</option>
                        <option value="done">Complete</option>
                    </select>
                </div>
                <div class="em-group">
                    <label class="em-label">Priority</label>
                    <select id="editPriority" class="em-select">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
            </div>
            <div class="em-row">
                <div class="em-group">
                    <label class="em-label">Due Date</label>
                    <input type="date" id="editDue" class="em-input">
                </div>
                <div class="em-group">
                    <label class="em-label">Est. Hours</label>
                    <input type="number" id="editHours" class="em-input" step="0.5" min="0">
                </div>
            </div>
            <div style="text-align:right;margin-top:2px">
                <span id="editCreated" style="font-size:11px;color:#475569"></span>
            </div>
        </div>
        <div class="em-footer">
            <button style="background:#ef4444;" onclick="deleteTaskEdit()">🗑 Delete</button>
            <button style="background:#3b82f6;flex:1" onclick="saveTaskEdit()">💾 Save Changes</button>
            <button style="background:#334155" onclick="closeEditModal()">Cancel</button>
            <span id="editSaveMsg" style="font-size:12px;font-weight:600;min-width:70px;text-align:center"></span>
        </div>
    </div>
</body>
</html>
