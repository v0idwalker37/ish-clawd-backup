<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - UnGouge Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #fff;
        }

        .back-btn {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: #475569;
        }

        .filters {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .filter-group select,
        .filter-group input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .tasks-grid {
            display: grid;
            gap: 15px;
        }

        .task-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-card:hover {
            background: #2d3748;
            transform: translateX(5px);
        }

        .task-card.urgent { border-left-color: #ef4444; }
        .task-card.high { border-left-color: #f97316; }
        .task-card.medium { border-left-color: #eab308; }
        .task-card.low { border-left-color: #6b7280; }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .task-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }

        .task-project {
            font-size: 12px;
            color: #94a3b8;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 10px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.todo { background: #334155; color: #94a3b8; }
        .status-badge.in_progress { background: #1e40af; color: #93c5fd; }
        .status-badge.done { background: #166534; color: #86efac; }
        .status-badge.blocked { background: #991b1b; color: #fca5a5; }

        .priority-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .priority-badge.urgent { background: #7f1d1d; color: #fca5a5; }
        .priority-badge.high { background: #7c2d12; color: #fdba74; }
        .priority-badge.medium { background: #713f12; color: #fde047; }
        .priority-badge.low { background: #374151; color: #9ca3af; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-complete {
            background: #166534;
            color: #86efac;
        }

        .btn-complete:hover {
            background: #14532d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📋 All Tasks</h1>
        <a href="/" class="back-btn">← Back to Dashboard</a>
    </div>

    <div class="filters">
        <div class="filter-group">
            <label>Search</label>
            <input type="text" id="searchInput" placeholder="Search tasks...">
        </div>
        <div class="filter-group">
            <label>Status</label>
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="blocked">Blocked</option>
                <option value="done">Done</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Priority</label>
            <select id="priorityFilter">
                <option value="">All Priorities</option>
                <option value="urgent">Urgent</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Project</label>
            <select id="projectFilter">
                <option value="">All Projects</option>
            </select>
        </div>
    </div>

    <div id="tasksContainer">
        <div class="loading">Loading tasks...</div>
    </div>

    <script>
        let allTasks = [];
        let projects = {};

        // Fetch tasks and projects
        async function loadData() {
            try {
                const [tasksRes, projectsRes] = await Promise.all([
                    fetch('/tasks'),
                    fetch('/projects')
                ]);
                
                const tasksData = await tasksRes.json();
                const projectsData = await projectsRes.json();
                
                allTasks = tasksData.tasks || [];
                projects = Object.fromEntries(
                    (projectsData.projects || []).map(p => [p.id, p.name])
                );

                // Populate project filter
                const projectFilter = document.getElementById('projectFilter');
                Object.entries(projects).forEach(([id, name]) => {
                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = name;
                    projectFilter.appendChild(option);
                });

                renderTasks();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('tasksContainer').innerHTML = 
                    '<div class="empty-state"><h2>Error loading tasks</h2><p>Please refresh the page</p></div>';
            }
        }

        function renderTasks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const priorityFilter = document.getElementById('priorityFilter').value;
            const projectFilter = document.getElementById('projectFilter').value;

            let filtered = allTasks.filter(task => {
                if (searchTerm && !task.title.toLowerCase().includes(searchTerm)) return false;
                if (statusFilter && task.status !== statusFilter) return false;
                if (priorityFilter && task.priority !== priorityFilter) return false;
                if (projectFilter && task.project_id != projectFilter) return false;
                return true;
            });

            const container = document.getElementById('tasksContainer');

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>No tasks found</h2><p>Try adjusting your filters</p></div>';
                return;
            }

            container.innerHTML = '<div class="tasks-grid">' + filtered.map(task => `
                <div class="task-card ${task.priority}" data-task-id="${task.id}">
                    <div class="task-header">
                        <div>
                            <div class="task-title">${task.title}</div>
                            <div class="task-project">${projects[task.project_id] || 'Unknown Project'}</div>
                        </div>
                        <div>
                            <span class="status-badge ${task.status}">${task.status.replace('_', ' ')}</span>
                        </div>
                    </div>
                    ${task.description ? `<p style="color: #94a3b8; font-size: 14px; margin-top: 10px;">${task.description}</p>` : ''}
                    <div class="task-meta">
                        <span class="priority-badge ${task.priority}">Priority: ${task.priority}</span>
                        ${task.due_date ? `<span>📅 Due: ${new Date(task.due_date).toLocaleDateString()}</span>` : ''}
                        ${task.estimated_hours ? `<span>⏱️ Est: ${task.estimated_hours}h</span>` : ''}
                    </div>
                    ${task.status !== 'done' ? `
                        <div class="task-actions">
                            <button class="btn btn-complete" onclick="markComplete(${task.id}, event)">✓ Mark Complete</button>
                        </div>
                    ` : ''}
                </div>
            `).join('') + '</div>';
        }

        async function markComplete(taskId, event) {
            event.stopPropagation();
            
            if (!confirm('Mark this task as complete?')) return;

            try {
                const response = await fetch(`/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'done', completed_at: new Date().toISOString() })
                });

                if (response.ok) {
                    const task = allTasks.find(t => t.id === taskId);
                    if (task) task.status = 'done';
                    renderTasks();
                } else {
                    alert('Failed to update task');
                }
            } catch (error) {
                console.error('Error updating task:', error);
                alert('Error updating task');
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', renderTasks);
        document.getElementById('statusFilter').addEventListener('change', renderTasks);
        document.getElementById('priorityFilter').addEventListener('change', renderTasks);
        document.getElementById('projectFilter').addEventListener('change', renderTasks);

        // Load data on page load
        loadData();
    </script>
</body>
</html>
