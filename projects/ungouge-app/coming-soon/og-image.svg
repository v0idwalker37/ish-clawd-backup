<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Shield icon -->
  <g transform="translate(100, 180)">
    <path d="M60 10 L110 30 L110 80 C110 120 60 150 60 150 C60 150 10 120 10 80 L10 30 Z" 
          fill="none" stroke="url(#green)" stroke-width="6"/>
    <path d="M40 75 L55 90 L85 55" 
          fill="none" stroke="url(#green)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Logo text -->
  <text x="230" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#green)">
    Ungouge.ai
  </text>
  
  <!-- Tagline -->
  <text x="230" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#94a3b8">
    Know Before You Sign
  </text>
  
  <!-- Main headline -->
  <text x="230" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#f8fafc">
    Stop overpaying for
